<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=2,user-scalable=no" />
<meta name="theme-color" content="#0a0e27" />
<title>Қазақ жеріндегі реформалар — Интерактивті Mind Map</title>
<meta name="description" content="XVIII–XIX ғасырлардағы Ресей империясының Қазақстандағы реформалары. Интерактивті тармақталған схема. ҰБТ/ЖОО бағдарламасына сәйкес." />
<link rel="manifest" href="manifest.json" />
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/main.css" />
</head>
<body>

<!-- Animated background -->
<div class="bg-anim" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>
</div>

<!-- Top toolbar -->
<header class="topbar" role="banner">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="40" height="40">
        <defs>
          <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4f8cff"/>
            <stop offset="100%" stop-color="#a855f7"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="30" fill="url(#brandGrad)"/>
        <path d="M32 12 L36 28 L52 28 L40 38 L44 54 L32 45 L20 54 L24 38 L12 28 L28 28 Z" fill="#FFDA27" opacity="0.95"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1 class="brand-title">Қазақ жеріндегі реформалар</h1>
      <p class="brand-sub">XVIII–XIX ғасырлар · Интерактивті Mind Map</p>
    </div>
  </div>

  <div class="toolbar" role="toolbar" aria-label="Құралдар тақтасы">
    <button class="tb-btn" id="btn-expand" type="button" title="Барлығын ашу" aria-label="Барлық тармақтарды ашу">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      <span>Ашу</span>
    </button>
    <button class="tb-btn" id="btn-collapse" type="button" title="Барлығын жабу" aria-label="Барлық тармақтарды жабу">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      <span>Жабу</span>
    </button>
    <span class="tb-sep" aria-hidden="true"></span>
    <button class="tb-btn" id="btn-zoom-in" type="button" title="Үлкейту" aria-label="Үлкейту">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M21 21l-4.3-4.3"/></svg>
    </button>
    <button class="tb-btn" id="btn-zoom-out" type="button" title="Кішірейту" aria-label="Кішірейту">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-4.3-4.3"/></svg>
    </button>
    <button class="tb-btn" id="btn-zoom-reset" type="button" title="Бастапқы күйге қайтару" aria-label="Масштабты қалпына келтіру">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9v3l-4-4 4-4"/><path d="M3 12a9 9 0 003 6.7"/></svg>
    </button>
    <span class="tb-sep" aria-hidden="true"></span>
    <button class="tb-btn" id="btn-fullscreen" type="button" title="Толық экран" aria-label="Толық экранға ауысу">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="tb-btn" id="btn-search" type="button" title="Іздеу" aria-label="Іздеу">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span>Іздеу</span>
    </button>
    <span class="tb-sep" aria-hidden="true"></span>
    <div class="tb-export" id="export-menu">
      <button class="tb-btn" id="btn-export" type="button" title="Экспорт" aria-label="Экспорт">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
        <span>Экспорт</span>
      </button>
      <div class="export-dropdown" id="export-dropdown" role="menu" hidden>
        <button data-fmt="png" type="button">PNG суреті</button>
        <button data-fmt="pdf" type="button">PDF құжаты</button>
        <button data-fmt="svg" type="button">SVG файлы</button>
        <button data-fmt="json" type="button">JSON деректері</button>
        <button data-fmt="print" type="button">Басып шығару</button>
      </div>
    </div>
  </div>
</header>

<!-- Main canvas (the mind map) -->
<main class="canvas-wrap" id="canvas-wrap" role="main">
  <div class="canvas" id="canvas">
    <!-- SVG layer for connectors -->
    <svg class="connectors" id="connectors" aria-hidden="true">
      <defs>
        <linearGradient id="grad-line" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#4f8cff" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6"/>
        </linearGradient>
        <linearGradient id="grad-line-active" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#FFDA27" stop-opacity="1"/>
          <stop offset="100%" stop-color="#fb923c" stop-opacity="1"/>
        </linearGradient>
        <radialGradient id="grad-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFDA27" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#FFDA27" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g id="connectors-group"></g>
    </svg>
    <!-- Node layer -->
    <div class="nodes-layer" id="nodes-layer"></div>
  </div>

  <!-- Search overlay -->
  <div class="search-overlay" id="search-overlay" hidden>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Іздеу: хан, алым-салық, Кенесары..." autocomplete="off" />
      <button class="search-close" id="search-close" type="button" aria-label="Жабу">×</button>
    </div>
    <div class="search-results" id="search-results"></div>
  </div>

  <!-- Node detail panel -->
  <aside class="detail-panel" id="detail-panel" hidden>
    <button class="detail-close" id="detail-close" type="button" aria-label="Жабу">×</button>
    <div class="detail-header">
      <span class="detail-icon" id="detail-icon"></span>
      <h2 class="detail-title" id="detail-title"></h2>
      <p class="detail-id" id="detail-id"></p>
    </div>
    <div class="detail-body">
      <p class="detail-desc" id="detail-desc"></p>
      <div class="detail-children" id="detail-children"></div>
    </div>
  </aside>

  <!-- Minimap -->
  <div class="minimap" id="minimap" aria-label="Миникарта">
    <div class="minimap-viewport" id="minimap-viewport"></div>
  </div>
</main>

<!-- Initial welcome overlay -->
<div class="welcome" id="welcome">
  <div class="welcome-card">
    <div class="welcome-emblem">
      <svg viewBox="0 0 200 200" width="100" height="100">
        <defs>
          <linearGradient id="welGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4f8cff"/>
            <stop offset="100%" stop-color="#a855f7"/>
          </linearGradient>
        </defs>
        <circle cx="100" cy="100" r="90" fill="url(#welGrad)"/>
        <circle cx="100" cy="92" r="38" fill="#FFDA27"/>
        <g stroke="#FFDA27" stroke-width="3" fill="none" stroke-linecap="round">
          <line x1="50" y1="140" x2="92" y2="92"/>
          <line x1="150" y1="140" x2="108" y2="92"/>
          <line x1="78" y1="100" x2="122" y2="100"/>
          <line x1="100" y1="65" x2="100" y2="115"/>
        </g>
      </svg>
    </div>
    <h2>Қазақ жеріндегі реформалар</h2>
    <p>Орталық түйінді басып, тармақтарды ашыңыз. Төрт деңгейлі интерактивті схема.</p>
    <div class="welcome-hints">
      <div><kbd>🖱️</kbd> Тармақты басу</div>
      <div><kbd>👆</kbd> Таңдау үшін drag</div>
      <div><kbd>🔍</kbd> Zoom in/out</div>
      <div><kbd>⌨️</kbd> Tab — навигация</div>
    </div>
    <button class="welcome-btn" id="welcome-go" type="button">Бастау →</button>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- App -->
<script type="module" src="js/main.js"></script>
</body>
</html>
